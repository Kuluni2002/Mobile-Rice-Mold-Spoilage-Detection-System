name: mobile_app
description: "AI-powered rice mold detection system for small-scale millers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera & Image Processing
  camera: ^0.10.3+2
  image: ^3.3.0
  image_picker: ^1.2.1

  # Machine Learning
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git
      ref: main

  # Database
  sqflite: ^2.2.8
  path_provider: ^2.0.15

  # Charts & Visualization
  fl_chart: ^1.1.1

  # Gemini AI
  google_generative_ai: ^0.4.3

  # Networking
  http: ^1.1.0
  dio: ^5.3.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # UI Components
  flutter_svg: ^2.0.7
  google_fonts: ^7.0.2
  intl: ^0.20.2

  # Utilities
  shared_preferences: ^2.2.0
  permission_handler: ^12.0.1
  path: ^1.8.3
  uuid: ^4.0.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true



  assets:
    - assets/images/
    - assets/models/efficientnet_rice_FINAL.tflite
    - assets/models/stage1_healthy_vs_mold.tflite
    - assets/models/stage2_earlyrisk_vs_spoiled.tflite
    - assets/models/labels.json
    - assets/icons/
